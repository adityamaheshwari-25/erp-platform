# The ClusterSecretStore defines how to authenticate with AWS Secrets Manager.
# It uses the External Secrets controller's EKS Pod Identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces: [default]
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
---
# The ExternalSecret tells the operator to read the JSON secret at erp-cluster/db-credentials
# and extract each property (host, port, username, password, dbname) into a Kubernetes Secret
# named erp-db-credentials. The secret refreshes every hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-db-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: erp-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: erp-cluster/db-credentials
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: erp-cluster/db-credentials
        property: port
    - secretKey: DB_USER
      remoteRef:
        key: erp-cluster/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: erp-cluster/db-credentials
        property: password
    - secretKey: DB_NAME
      remoteRef:
        key: erp-cluster/db-credentials
        property: dbname
