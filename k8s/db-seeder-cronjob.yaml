# The @hourly schedule tells Kubernetes to create a Job at the start of every hour.
# Each Job starts a Pod that uses curl to call the Inventory Service over its
# internal ClusterIP DNS name at http://inventory-service:8080/seed.
# With restartPolicy: OnFailure, Kubernetes restarts the container in the same Pod
# if curl exits with a nonzero status. The Job completes when curl exits successfully.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-seeder
  namespace: default
spec:
  schedule: "@hourly"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: seeder
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - "curl -s http://inventory-service:8080/seed"
          restartPolicy: OnFailure