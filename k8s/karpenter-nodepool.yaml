apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        # The lab's AWS organization policy denies Spot launches.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Use the x86-64 instance type already running in the EKS system node group.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: Karpenter-erp-cluster-9bd1eb74299573a087140c3d34
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: erp-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: erp-cluster
